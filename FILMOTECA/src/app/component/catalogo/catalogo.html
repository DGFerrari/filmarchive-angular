<div class="titulo_seccion">
    <h2>CATALOGO PELICULAS</h2>
    <h3>Peliculas: {{ ListaPeliculas.length }}</h3>
    <h3>Disponibles: {{ getTotalDisponibles(ListaPeliculas) }}</h3>
    <h3>Tiempo: {{ getTotalHoras(ListaPeliculas)}}</h3>
    <input #caja type="search" placeholder="Buscar..." (input)="busqueda.set(caja.value)"/>
</div>

<div class="lista_pelis">
  @for (peli of peliculasFiltradas(); track peli.getId()) {
    <app-p-tarjeta [pelis]="peli" [numLista]="$index"></app-p-tarjeta>
  } @empty { <!-- Si no se encuentran pelis -->
    <p>No se encontraron películas.</p>
  }
</div>
