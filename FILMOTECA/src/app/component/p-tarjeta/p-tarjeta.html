 <button class="alquilar" [disabled]="!pelis.getDisponible()" (click)="alquilar(pelis)">ALQUILAR</button>

        @if (!pelis.getDisponible()) {
             <button class="devolver" (click)="devolver(pelis)">DEVOLVER</button>
        }

<div [class]="pelis.getDisponible() ? 't-disponible' : 't-disponible t-no-disponible'">
    <div>
        
        <p class="num-tarjeta" [class]="(
            pelis.getPopularidad() == 1 ? 'popu-1' : 
            pelis.getPopularidad() == 2 ? 'popu-2' : 'popu-3'
        )">{{numLista + 1}}</p>

        <!-- Comprueba si hay imagen o no para usar un placeholder -->
        @if (pelis.getImgGrid()) {
            <img [src]="pelis.getImgGrid()" [alt]="pelis.getTitulo()" class="img-tarjeta">
        } @else {
            <img src="https://www.meme-arsenal.com/memes/f0817b058fc1b32bdbda2ca842b61888.jpg" [alt]="pelis.getTitulo()" class="img-tarjeta">
        }
    
    </div>
    <div class="info-tarjeta">
        <h1>{{pelis.getTitulo()}}</h1>
        <h2>{{pelis.getDirector()}}</h2>
        <p>{{pelis.getAno()}}</p>
        <p>{{pelis.getTiempo()}}</p>
        <p class="estrellas" [style.--valoracion]="pelis.getValoracion()">⭐{{pelis.getValoracion()}}</p>
    
        @if (pelis.getDisponible()) {
            <p>Disponible</p>
        } @else {
            <p>Alquilada</p>
        }
    </div>
</div>
