<div [class]="pelis.getDisponible() ? 't-disponible' : 't-no-disponible'">
    <div>
        <p class="num-tarjeta">{{numLista + 1}}</p>
        <img [src]="pelis.getImgGrid()" class="img-tarjeta">
    </div>
    <div class="info-tarjeta">
        <h1>{{pelis.getTitulo()}}</h1>
        <h2>{{pelis.getDirector()}}</h2>
        <p>{{pelis.getAno()}}</p>
        <p>{{pelis.getTiempo()}}</p>
        <p class="estrellas" [style.--valoracion]="pelis.getValoracion()">⭐{{pelis.getValoracion()}}</p>
    
        @if (pelis.getDisponible()) {
            <p>Disponible</p>
        } @else {
            <p>Alquilada</p>
        }
    </div>
</div>
